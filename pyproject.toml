[project]
name = "trialforecast"
version = "0.1.0"
description = "Sealed forecasting of randomised phase 3 oncology trial results."
readme = "README.md"
authors = [
    { name = "Abhijoy Sarkar" },
    { name = "Aarchi Singh Thakur" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trialforecast-universe = "trialforecast.universe:main"
trialseal-verify = "trialforecast.sealing:verify_command"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trialforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
