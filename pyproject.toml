[project]
name = "trialforecast"
version = "0.1.0"
description = "Sealed forecasting of randomised phase 3 oncology trial results."
readme = "README.md"
authors = [
    { name = "Abhijoy Sarkar" },
    { name = "Aarchi Singh Thakur" },
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.1",
    "google-genai>=2.29.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "openai>=3.26.1",
    "pandas>=2.2",
    "scipy>=1.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trialforecast-universe = "trialforecast.universe:main"
trialseal-verify = "trialforecast.sealing:verify_command"
trialseal-analysis = "trialforecast.report:main"
trialseal-pilot = "trialforecast.pilot:main"
trialseal-screening = "trialforecast.screen:main"
trialseal-reference = "trialforecast.reference:main"
trialseal-adjudicate = "trialforecast.adjudicate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trialforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
